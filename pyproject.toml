[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "business-ml-decision-analytics"
version = "0.1.0"
description = "Machine learning case studies connecting predictions to business decisions"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scikit-learn==1.8.0",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]
